name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Rebuild against moving base images and agent/install endpoints even when this repo is quiet.
    - cron: "17 4 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Reuse existing Namespace profiles. Leaving priority unspecified keeps these
# checks behind Bors control (priority 0) and compilation (priority 1).
jobs:
  test:
    # Storage fixtures require native, consistent inode/device metadata.
    runs-on: ubuntu-24.04
    env:
      # Test on the latest interpreter uv ships; macOS observations have their own native job.
      # requires-python >=3.11 is a declaration rather than a per-version matrix.
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-suffix: test
      - name: Run the test suite
        run: ./tests/run-all

  macos-recovery:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Check the source-checkout launcher environment
        run: ./tauceti --help
      - name: Check native macOS recovery observations and cleanup
        run: >-
          uv run python tests/recovery_maintenance.py
          RecoveryMaintenance.test_darwin_process_references_protect_cwd_files_and_session
          RecoveryMaintenance.test_darwin_missing_psutil_defers_cleanup_and_launchers_declare_it
          RecoveryMaintenance.test_darwin_owner_session_survives_leader_exit_but_not_pid_reuse_or_reboot
          RecoveryMaintenance.test_darwin_cleanup_and_record_retirement_without_procfs
          RecoveryMaintenance.test_native_darwin_process_references_and_owner_birth
          RecoveryMaintenance.test_native_darwin_session_survives_leader_exit

  prices:
    runs-on:
      - nscloud-ubuntu-24.04-amd64-2x4-with-features
      - namespace-features:github.run-id=${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out the review engine's price table
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TauCetiProject/TauCetiReview
          path: .review-engine
          sparse-checkout: runner/prices.json
          sparse-checkout-cone-mode: false
      # tauceti_worker/prices.json is a vendored copy, not a second table: the review engine owns
      # the rates, and two editable copies of a price table is how the cost model and the engine
      # came to disagree. Report the command that re-vendors it rather than a diff to hand-apply.
      - name: Compare the vendored price table with its source
        run: |
          if ! diff -u .review-engine/runner/prices.json tauceti_worker/prices.json; then
            echo "::error file=tauceti_worker/prices.json::Vendored price table has drifted from TauCetiProject/TauCetiReview runner/prices.json. Change rates there, then re-vendor: cp .review-engine/runner/prices.json tauceti_worker/prices.json"
            exit 1
          fi

  lint:
    runs-on:
      - nscloud-ubuntu-24.04-amd64-2x4-with-features
      - namespace-features:github.run-id=${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-suffix: lint
      # Pin ruff so a new release's rules/formatter can't turn CI red without a code change here.
      - name: ruff check
        run: uvx ruff@0.15.18 check .
      - name: ruff format --check
        run: uvx ruff@0.15.18 format --check .
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      # --severity=warning: skip the info/style notes on the deliberate `A && B || C` test idiom
      # (where B, an echo, always succeeds), while still failing on real warnings and errors.
      - name: ShellCheck
        run: shellcheck --severity=warning scripts/claim.sh scripts/git-safe-push scripts/gh-safe-pr-create scripts/docker-entrypoint tests/*.sh tests/run-all

  build:
    runs-on:
      - nscloud-ubuntu-24.04-amd64-2x4-with-features
      - namespace-features:github.run-id=${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-suffix: build
      - name: Build the wheel
        run: uv build
      # uv build proves the artifact builds; this proves the force-include mapping (prompts/ and
      # scripts/ into the tauceti_worker package) works once installed, and that the console script
      # runs. Run the import check from /tmp with -P so the source-tree tauceti_worker/ on the
      # checkout root can't shadow the installed package (whose prompts/scripts sit beside it).
      - name: Install smoke test
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/tauceti --help
          cd /tmp && /tmp/smoke/bin/python -P - <<'PY'
          import pathlib
          import tauceti_worker.__main__ as m
          base = pathlib.Path(m.__file__).parent
          assert (base / "prompts").is_dir(), "prompts/ missing from the installed wheel"
          assert (base / "scripts").is_dir(), "scripts/ missing from the installed wheel"
          from tauceti_worker.cost_model import AI_PRICES
          assert AI_PRICES, "prices.json missing from the installed wheel"
          print("bundled prompts/, scripts/ and prices.json present")
          PY

  docker:
    runs-on:
      - nscloud-ubuntu-24.04-amd64-8x16-with-features
      - namespace-features:github.run-id=${{ github.run_id }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate the Compose model
        run: docker compose config --quiet
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build the worker image from this revision
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: |
            tauceti-worker:ci
            tauceti-worker:local
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
      - name: Smoke-test the image and Compose service
        run: |
          docker compose run --rm --no-deps \
            -e HOME=/tmp/isolated-home \
            tauceti bash -euo pipefail -c '
            mkdir -p "$HOME"
            for tool in gh git uvx jq lake codex claude tauceti-oauth-refresh; do
              command -v "$tool" >/dev/null
            done
            lake --version
            ./tauceti --help >/dev/null
            claude auth login --help >/dev/null
            codex login --help 2>&1 | grep -F -- --device-auth >/dev/null
            doctor_output="$(./tauceti doctor || true)"
            printf "%s\n" "$doctor_output"
            printf "%s\n" "$doctor_output" | grep -F "[ok     ] lake"
            git init -q /tmp/git-smoke
            git -C /tmp/git-smoke commit --allow-empty -m smoke >/dev/null
            test "$(git -C /tmp/git-smoke log -1 --format=%ae)" = "tauceti-worker@users.noreply.github.com"
            set +e
            claude_output="$(timeout 15 claude -p "Reply with ok" --model opus --dangerously-skip-permissions 2>&1)"
            set -e
            ! printf "%s\n" "$claude_output" | grep -F "cannot be used with root/sudo privileges"
          '
      - name: Smoke-test configurable worker options
        run: |
          TAUCETI_WORKER_ARGS=--help docker compose run --rm --no-deps tauceti 2>&1 |
            grep -F "usage: tauceti work"
          test ! -e .env
          trap 'rm -f .env' EXIT
          printf '%s\n' 'TAUCETI_WORKER_ARGS=--help' >.env
          docker compose config --format json | python3 -c \
            'import json, sys; assert json.load(sys.stdin)["services"]["tauceti"]["environment"]["TAUCETI_WORKER_ARGS"] == "--help"'
      # Exercise the actual tini -> uv -> Python process tree used by Compose. The
      # unit test invokes Python directly and cannot prove that SIGTERM crosses uv.
      - name: Graceful stop reaches the worker loop
        run: |
          docker compose up -d tauceti
          for attempt in $(seq 1 30); do
            docker compose logs --no-color tauceti | grep -F "loop start:" && break
            test "$attempt" -lt 30
            sleep 1
          done
          docker compose stop -t 60 tauceti
          worker_log="$(docker compose logs --no-color tauceti)"
          printf "%s\n" "$worker_log"
          printf "%s\n" "$worker_log" | grep -F "loop terminated — stopping"
          container_id="$(docker compose ps -aq tauceti)"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$container_id")" = 143
      - name: Smoke-test both credential refresher services
        run: |
          for provider in claude codex; do
            log="$(mktemp)"
            docker run --rm --entrypoint /usr/local/bin/tauceti-oauth-refresh \
              -e TAUCETI_REFRESH_ONCE=1 \
              tauceti-worker:ci "$provider" >"$log" 2>&1
            grep -F "$provider-refresh: waiting for" "$log"
          done
      - name: Probe the live OAuth contracts
        if: github.event_name == 'schedule'
        run: |
          docker run --rm -i --entrypoint python3 tauceti-worker:ci <<'PY'
          import requests

          probes = [
              (
                  "claude",
                  "https://platform.claude.com/v1/oauth/token",
                  {
                      "grant_type": "refresh_token",
                      "refresh_token": "invalid-ci-probe",
                      "client_id": "9d1c250a-e61b-44d9-88ed-5944d1962f5e",
                      "scope": "user:profile user:inference user:sessions:claude_code user:mcp_servers",
                  },
              ),
              (
                  "codex",
                  "https://auth.openai.com/oauth/token",
                  {
                      "grant_type": "refresh_token",
                      "refresh_token": "invalid-ci-probe",
                      "client_id": "app_EMoamEEZ73f0CkXaXp7hrann",
                  },
              ),
          ]
          for name, url, payload in probes:
              response = requests.post(url, json=payload, timeout=30)
              assert 400 <= response.status_code < 500, (name, response.status_code)
              assert isinstance(response.json(), dict), name
              print(f"{name}: reachable OAuth endpoint rejected the invalid probe as expected")
          PY
